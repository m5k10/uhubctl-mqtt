[package]
name = "uhubctl-mqtt"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6", features = ["derive"] }
paho-mqtt = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusb = "0.9"
hostname = "0.4"

[dev-dependencies]
tempfile = "3"
